<title>MegaBlast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Una sola schermata: il gioco occupa tutta la pagina, scuro come la home */
:root { --bg: #0c0b10; --fg: #f3e2cf; color-scheme: dark; }
html, body { height: 100%; overflow: hidden; }
body { position: fixed; inset: 0; background: var(--bg); color: var(--fg);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
.canvas-app-container { position: absolute; overflow: hidden;
  top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
#canvas { display: block; width: 100%; outline: none; border: 0; }
.canvas-app-progress { position: absolute; left: 20%; right: 20%; top: 50%; height: 4px; background: #2a2630; }
.canvas-app-progress-bar { height: 4px; background: var(--fg); transform-origin: left; transition: transform .3s ease; }
#ruota { display: none; position: fixed; inset: 0; z-index: 5; background: var(--bg); align-items: center; justify-content: center;
  font: 600 20px/1.4 Georgia, serif; letter-spacing: .06em; text-align: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
@media (orientation: portrait) and (pointer: coarse) { #ruota { display: flex; } }
</style>
<div id="app-container" class="canvas-app-container">
  <div id="canvas-container"><canvas id="canvas" tabindex="1" width="1280" height="720"></canvas></div>
</div>
<div id="ruota">Gira il telefono in orizzontale</div>
