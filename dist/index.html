<html lang="it">

<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Copione di MegaBlast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden] { display: none !important; }
/* Banco del fabbro: la mappa del livello al centro come un'incudine sotto la lampada,
   strumenti attorno; la pergamena solo dove parla un personaggio (come nel gioco). */
:root {
	color-scheme: dark;
	--fondo: #15120f;        /* la forgia spenta */
	--banco: #1f1a16;        /* i pannelli */
	--banco2: #2a231d;
	--riga: #3b3129;
	--testo: #efe4d3;
	--tenue: #a8998a;
	--brace: #f0a640;        /* accento: il metallo caldo */
	--oro: #e9c35a;          /* il testo d'oro degli obiettivi */
	--pergamena: #f2e1bf;
	--inchiostro: #1f120c;
	--blu: #6fa8d6;          /* squadra 1 */
	--rosso: #d9674b;        /* squadra 2 */
	--grigio: #8e8478;       /* fantocci */
	--viola: #a98ad8;        /* eventi senza posto */
	--favilla: #8ccfef;      /* Favilla che mostra le mosse */
	--verde: #7fbf7a;
	--errore: #ff7a66;
	--f-titolo: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
	--f-testo: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
	--f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--fondo); color: var(--testo); font-family: var(--f-testo); font-size: 14px;
	padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 0; display: flex; flex-direction: column; overflow-x: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--banco2); border: 1px solid var(--riga); border-radius: 6px; padding: 6px 10px; }
button:hover { border-color: var(--brace); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brace); outline-offset: 1px; }
button.caldo { background: var(--brace); color: var(--inchiostro); border-color: var(--brace); font-weight: 700; }
button.piccolo { padding: 3px 7px; font-size: 12px; }
button[disabled] { opacity: .4; cursor: default; }
select, input, textarea { background: var(--fondo); border: 1px solid var(--riga); border-radius: 5px; padding: 5px 7px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--tenue); }
label.riga { flex-direction: row; align-items: center; gap: 6px; color: var(--testo); font-size: 13px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

header.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--riga); }
header .marchio { font-family: var(--f-titolo); font-size: 22px; letter-spacing: .5px; color: var(--brace); cursor: pointer; }
header .briciole { color: var(--tenue); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .briciole b { color: var(--testo); font-weight: 700; }
header .azioni { display: flex; flex-wrap: wrap; gap: 6px; }
#avviso { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
	background: var(--banco2); border: 1px solid var(--brace); padding: 8px 14px; border-radius: 8px; z-index: 50; max-width: 90vw; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Cruscotto */
.cruscotto { padding-block: 16px; display: flex; flex-direction: column; gap: 22px; overflow: auto; }
.capitolo h2 { font-family: var(--f-titolo); font-weight: 400; font-size: 20px; margin: 0; text-wrap: balance; }
.capitolo .testa { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.capitolo .testa .info { color: var(--tenue); font-size: 13px; }
.carte { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.carta { background: var(--banco); border: 1px solid var(--riga); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0; }
.carta:hover { border-color: var(--brace); }
.carta .mini { aspect-ratio: 16 / 9; max-width: 100%; background: #0d0b09; display: block; }
.carta .corpo { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
.carta .tit { font-weight: 700; font-size: 15px; }
.carta .meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 11.5px; color: var(--tenue); }
.pill { border: 1px solid var(--riga); border-radius: 99px; padding: 1px 7px; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
.pill.grande { border-color: var(--brace); color: var(--brace); }
.pill.err { border-color: var(--errore); color: var(--errore); }
.carta .mosse { display: flex; gap: 4px; padding: 0 10px 10px; }
.nuova { border: 1px dashed var(--riga); border-radius: 8px; display: grid; place-items: center; min-height: 120px; color: var(--tenue); background: none; }

/* Editor */
.editor { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr) auto; gap: 0 12px; padding-block: 10px; }
.tela { position: relative; background: #0d0b09; border: 1px solid var(--riga); border-radius: 8px; overflow: hidden; min-height: 300px; touch-action: none; }
.tela svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.strumenti { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 5px; max-width: calc(100% - 16px); }
.strumenti button { background: rgba(31, 26, 22, .9); font-size: 12px; padding: 4px 8px; }
.strumenti button.on { border-color: var(--brace); color: var(--brace); }
.nota-tela { position: absolute; right: 8px; bottom: 8px; background: rgba(31, 26, 22, .9); border: 1px solid var(--riga); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--tenue); max-width: 60%; }
.pannello { grid-row: 1 / span 2; grid-column: 2; background: var(--banco); border: 1px solid var(--riga); border-radius: 8px; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pannello h3 { font-family: var(--f-titolo); font-weight: 400; font-size: 17px; margin: 0; }
.pannello .gruppo { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--riga); padding-top: 10px; }
.pannello .due { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pannello .quattro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pannello .bottoni { display: flex; flex-wrap: wrap; gap: 6px; }
.scelte { display: flex; flex-wrap: wrap; gap: 4px; }
.scelte label { flex-direction: row; align-items: center; gap: 4px; border: 1px solid var(--riga); border-radius: 99px; padding: 2px 8px; color: var(--testo); font-size: 12px; }
.cond { border: 1px solid var(--riga); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.cond .r { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.cond .r select, .cond .r input { flex: 1; min-width: 70px; }
.cond .o { border-left: 3px solid var(--viola); padding-left: 6px; display: flex; flex-direction: column; gap: 5px; }
.problemi { color: var(--errore); font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.guida { background: var(--banco2); border: 1px solid var(--riga); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; }
.guida summary { cursor: pointer; font-weight: 700; color: var(--brace); }
.guida ol, .guida ul { margin: 6px 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.guida ul.legenda { list-style: none; padding-left: 0; }
.guida .seg { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.guida .seg.cerchio { border: 2px dashed var(--oro); width: 9px; height: 9px; }
.spiega { margin: 0; color: var(--tenue); font-size: 12.5px; line-height: 1.4; }
.aiuto { color: var(--tenue); font-size: 11.5px; line-height: 1.35; }
.pannello .tipo-sel { font-size: 11px; color: var(--tenue); text-transform: uppercase; letter-spacing: .6px; }

/* striscia del tempo */
.tempo { grid-column: 1; margin-top: 10px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; max-height: 38vh; }
.colonna { flex: 0 0 200px; background: var(--banco); border: 1px solid var(--riga); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.colonna.su { border-color: var(--brace); }
.colonna .capo { font-size: 11.5px; color: var(--tenue); text-transform: uppercase; letter-spacing: .5px; }
.colonna .obb { color: var(--oro); font-weight: 700; font-size: 13px; }
.gettone { background: var(--banco2); border: 1px solid var(--riga); border-left: 4px solid var(--tenue); border-radius: 6px; padding: 5px 7px; font-size: 12.5px; cursor: grab; text-align: left; }
.gettone.grande { border-left-color: var(--brace); }
.gettone.striscia { border-left-color: var(--blu); }
.gettone.cassa { border-left-color: var(--verde); }
.gettone.mostra { border-left-color: var(--favilla); }
.mosse { display: flex; flex-direction: column; gap: 6px; }
.mossa { border: 1px solid var(--riga); border-left: 3px solid var(--favilla); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.mossa .r { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.mossa .r select, .mossa .r input { flex: 1; min-width: 70px; }
.mossa .n { font-family: var(--f-num); color: var(--favilla); font-weight: 700; }
.gettone.sel { outline: 2px solid var(--brace); }
.gettone .chi { font-size: 10.5px; color: var(--tenue); text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; gap: 6px; }
.gettone .q { display: block; margin-top: 3px; font-size: 11px; color: var(--viola); }
.colonna .piu { font-size: 12px; color: var(--tenue); background: none; border-style: dashed; }
.colonna .piu.passo { color: var(--oro); border-color: rgba(233,195,90,.45); }
.colonna .piu.passo .metti { display: none; }
.tempo.trascino-passo .colonna .piu.passo { background: rgba(233,195,90,.16); border-style: solid; padding-block: 12px; }
.tempo.trascino-passo .colonna .piu.passo .nuovo { display: none; }
.tempo.trascino-passo .colonna .piu.passo .metti { display: inline; }
.passo-carta { background: rgba(233,195,90,.08); border: 1px solid rgba(233,195,90,.5); border-radius: 7px; padding: 7px 8px; display: grid; grid-template-columns: 26px 1fr; gap: 3px 7px; cursor: grab; text-align: left; }
.passo-carta.sel { outline: 2px solid var(--brace); }
.passo-carta.rotto { border-color: var(--errore); background: rgba(255,122,102,.08); }
.passo-carta .n { grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; background: var(--oro); color: var(--inchiostro); font-weight: 700; display: grid; place-items: center; font-size: 13px; }
.passo-carta.fine .n { background: var(--verde); }
.passo-carta.fine .tp { color: var(--verde); }
.passo-carta .tp { color: var(--oro); font-weight: 700; font-size: 13px; }
.passo-carta .cosa { font-size: 11.5px; color: var(--tenue); }
.passo-carta .dip, .passo-carta .gioca-qui { grid-column: 1 / -1; }
.passo-carta .dip { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11px; }
.passo-carta .serve { color: var(--tenue); }
.chip { border-radius: 99px; padding: 1px 7px; border: 1px solid; }
.chip.ok { color: var(--verde); border-color: rgba(127,191,122,.5); }
.chip.no { color: var(--errore); border-color: var(--errore); }
.passo-carta .gioca-qui { justify-self: start; margin-top: 3px; color: var(--brace); }
.freccia { flex: 0 0 auto; align-self: flex-start; margin-top: 44px; display: flex; flex-direction: column; align-items: center; color: var(--oro); font-size: 18px; line-height: 1; margin-inline: -4px; }
.freccia .fn { font-size: 10px; color: var(--tenue); }

/* vignetta come nel gioco */
.vignetta { background: var(--pergamena); color: var(--inchiostro); border: 3px solid var(--inchiostro); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: 74px 1fr; gap: 10px; }
.vignetta img { width: 74px; height: 74px; object-fit: contain; }
.vignetta .nome { font-family: var(--f-titolo); font-size: 13px; }
.vignetta .frase { font-family: var(--f-titolo); font-size: 14px; line-height: 1.25; }
.vignetta .disegno { grid-column: 1 / -1; background: #1c1820; color: var(--testo); border-radius: 4px; padding: 10px; display: flex; gap: 8px; align-items: center; font-size: 12px; }
.vignetta .disegno img { width: 32px; height: 32px; }
.vignetta .vai { grid-column: 1; background: var(--inchiostro); color: var(--pergamena); font-family: var(--f-titolo); text-align: center; border-radius: 3px; padding: 4px; }
.striscia-ant { background: rgba(10, 9, 12, .85); border: 1px solid var(--riga); border-radius: 6px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.striscia-ant img { width: 40px; height: 40px; object-fit: contain; }

/* GIOCA */
#gioca { position: fixed; inset: 0; background: rgba(0, 0, 0, .92); z-index: 40; display: flex; flex-direction: column;
	padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
#gioca .su { display: flex; gap: 8px; align-items: center; }
#gioca .su span { flex: 1; color: var(--tenue); }
#gioca iframe { flex: 1; border: 0; width: 100%; background: #000; border-radius: 6px; }
#rivedi { position: fixed; inset: 0; background: rgba(0, 0, 0, .94); z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 10px;
	padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#rivedi .su, #rivedi .giu { display: flex; gap: 8px; align-items: center; width: min(100%, 960px); }
#rivedi .su span { flex: 1; color: var(--tenue); }
#rivedi .giu { justify-content: center; }
#rivedi .giu span { min-width: 7em; text-align: center; color: var(--tenue); }
#rivedi-schermo { position: relative; width: min(100%, 960px, calc((100vh - 140px) * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; background: #0d0b09 center / cover no-repeat; border: 1px solid var(--riga); border-radius: 8px; overflow: hidden; }
#rivedi-schermo .velo { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); }
#rivedi-schermo .obiettivo { position: absolute; right: 2%; top: 3%; max-width: 40%; color: var(--oro); font-family: var(--f-titolo); font-size: clamp(12px, 2.2vw, 20px); text-align: right; text-shadow: 0 2px 0 #000; }
#rivedi-schermo .striscia-ant { position: absolute; left: 20%; right: 20%; top: 12%; }
#rivedi-schermo .vignetta { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(80%, 520px); box-shadow: 0 10px 40px #000; }
#rivedi-schermo .evento { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--banco2); border: 1px solid var(--verde); color: var(--verde); border-radius: 8px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; font-size: 15px; }
#rivedi-schermo .evento img { width: 48px; height: 48px; }
#rivedi .didascalia { width: min(100%, 960px); background: var(--banco); border: 1px solid var(--riga); border-radius: 6px; color: var(--testo); padding: 8px 12px; font-size: 13px; line-height: 1.4; }
#rivedi .didascalia b { color: var(--brace); }
@media (max-width: 700px) { #rivedi-schermo .vignetta { width: 92%; transform: translate(-50%, -50%) scale(.8); } }
.conferma { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--errore); font-size: 12.5px; }

@media (max-width: 900px) {
	html, body { height: auto; }
	.editor { flex: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto auto; }
	.pannello { grid-row: 3; grid-column: 1; margin-top: 10px; overflow: visible; }
	.tempo { grid-row: 2; max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="barra">
	<span class="marchio" id="marchio" title="Torna al cruscotto">COPIONE</span>
	<span class="briciole" id="briciole"></span>
	<span class="azioni">
		<button id="annulla" title="Annulla (Ctrl+Z)">↶</button>
		<button id="rifai" title="Rifai (Ctrl+Shift+Z)">↷</button>
		<button id="b-rivedi" title="Tutte le frasi del livello in fila, come le vede il giocatore, senza giocare">Rivedi le frasi</button>
		<button id="b-gioca" class="caldo" title="Prova questo livello nel gioco, così com'è adesso">GIOCA</button>
		<button id="b-manda" title="Manda tutte le modifiche a Claude, che le mette nel gioco">Manda a Claude</button>
		<button id="b-copia" title="Copia il copione come testo, da incollare a Claude in chat">Copia il testo</button>
		<button id="b-ripristina" title="Butta le modifiche fatte in questo browser e torna al gioco di oggi">Ripristina</button>
	</span>
</header>
<main id="main"></main>
<div id="avviso" hidden></div>
<div id="rivedi" hidden>
	<div class="su"><span id="rivedi-dove"></span><button id="rivedi-cambia">Cambia questa</button><button id="rivedi-chiudi" class="caldo">Chiudi</button></div>
	<div id="rivedi-schermo"></div>
	<div id="rivedi-dida" class="didascalia"></div>
	<div class="giu"><button id="rivedi-prima">← Indietro</button><span id="rivedi-conta" class="num"></span><button id="rivedi-dopo" class="caldo">Avanti →</button></div>
</div>
<div id="gioca" hidden>
	<div class="su"><span id="gioca-nome"></span><button id="gioca-ancora">Ricomincia</button><button id="gioca-chiudi" class="caldo">Chiudi</button></div>
	<iframe id="gioca-frame" title="Il livello nel gioco" allow="autoplay; fullscreen; gamepad"></iframe>
</div>

// ---------------------------------------------------------------- piccoli aiuti
function metti(n, ...figli) { n.append(...figli.flat().filter(f => f != null && f !== false)); return n; }
function el(tag, props, ...figli) {
	const n = document.createElement(tag);
	for (const [k, v] of Object.entries(props || {})) {
		if (v == null || v === false) continue;
		if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
		else if (k === "class") n.className = v;
		else if (k === "text") n.textContent = v;
		else n.setAttribute(k, v === true ? "" : v);
	}
	for (const f of figli.flat()) if (f != null && f !== false) n.append(f.nodeType ? f : document.createTextNode(String(f)));
	return n;
}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...figli) {
	const n = document.createElementNS(NS, tag);
	for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
	for (const f of figli.flat()) if (f != null) n.append(f.nodeType ? f : document.createTextNode(String(f)));
	return n;
}

function nomeGiocatore(l, i) {

// un trigger in parole
function frase(q) {
	if (!q) return "";
	const p = [];
	if (q.passo != null) p.push("finito il passo " + q.passo);
	if (q.turno != null) p.push("al tuo turno n. " + q.turno);
	if (q.turno_altri != null) p.push("al turno n. " + q.turno_altri + " degli altri");
	if (q.di_turno) p.push(q.di_turno === "tu" ? "mentre tocca a te" : "mentre tocca agli altri");
	if (q.evento) p.push("quando " + (q.di === "altri" ? "un altro " : "") + nomeDi(NOMI_EVENTI, q.evento) + (q.arma ? " con " + nomeArma(q.arma) : ""));
	if (q.tocca) p.push("tocchi " + nomeDi(NOMI_COMANDI, q.tocca));
	if (q.usato) p.push("hai già usato " + nomeDi(NOMI_COMANDI, q.usato));
	if (q.finestra) p.push("dopo il primo attacco del turno");
	if (q.in_caduta) p.push("cadi veloce e hai il paracadute");
	if (q.corona) p.push("sei primo in classifica");
	if (q.conta) p.push(nomeDi(NOMI_CONTATORI, q.conta) + ": almeno " + (q.almeno || 1));
	if (q.vicino != null) p.push("sei a meno di " + q.vicino + " pixel da Favilla");
	if (q.uno) p.push("basta uno fra: " + q.uno.map(frase).join(" | "));
	return p.join(" e ");
}

function verboMossa(m) { return MOSSE_FAVILLA.map(v => v[0]).find(v => v in m) || "aspetta"; }

		aspetta: { aspetta: 1 }, dice: { dice: "Guarda!" }, posa: { posa: "vittoria", secondi: 1.5 } }[v];
}
function fraseMossa(m) {
	const v = verboMossa(m);
	if (v === "cammina") return "cammina fino a x " + m.cammina;
	if (v === "salta") return "salta " + (NOMI_LATI[m.salta] || m.salta);

	if (v === "aspetta") return "aspetta " + m.aspetta + " s";

function fraseMosse(d) { return (d.mosse || []).map(fraseMossa).join(", poi ") || "nessuna mossa"; }
function colonnaDimostra(d) { return d.quando ? colonnaDi(d.quando) : 0; }
// la riga parte da un passo e basta: va nella colonna di quel passo
function soloPasso(q) { return q && Object.keys(q).length === 1 && q.passo != null; }
// la colonna della linea del tempo di una riga: 0 per "All'inizio" (il tuo primo turno),
// k per "Fatto il passo k", null se il trigger non ha un posto (va in "Quando succede")
function colonnaDi(q) {
	if (soloPasso(q)) return q.passo;
	if (q && Object.keys(q).length === 1 && q.turno === 1) return 0;
	return null;
}

// ---------------------------------------------------------------- dipendenze fra i passi
// Ogni passo viene dopo quello prima; in più può avere bisogno di qualcosa che deve
// arrivare prima di lui: la cassa da prendere, l'arma da usare se si parte senza armi,
// il robot da colpire. Per ogni passo: [{ testo, ok, perche }].
function arrivaArma(l, arma, i) {
	// quando l'arma arriva al giocatore: il passo dopo cui cade la cassa o si apre la carta che la dà (-1: mai)
	let primo = -1;
	for (const c of l.casse || []) if (c.arma === arma && (primo < 0 || c.dopo < primo)) primo = c.dopo;
	for (const c of (Array.isArray(l.cards) ? l.cards : [])) if (c.arma === arma && c.give && (primo < 0 || c.dopo < primo)) primo = c.dopo;
	return primo;
}
function quandoArriva(n) { return n === 0 ? "all'inizio" : "finito il passo " + n; }
function dipendenze(l) {
	return (l.obiettivo || []).map((o, i) => {
		const out = [];
		if (o.prendi) {
			const d = (l.casse || []).filter(c => c.arma === o.prendi).map(c => c.dopo).sort((a, b) => a - b)[0];
			out.push(d == null ? { testo: "cassa " + nomeArma(o.prendi), ok: false, perche: "non c'è nessuna cassa con quest'arma" }
				: d <= i ? { testo: "cassa " + nomeArma(o.prendi), ok: true, perche: "cade " + quandoArriva(d) }
				: { testo: "cassa " + nomeArma(o.prendi), ok: false, perche: "cade solo " + quandoArriva(d) + ", troppo tardi" });
		}
		const chi = o.hit != null ? o.hit : o.down;
		if (typeof chi === "number") {
			const c = chi - 1;
			out.push(!(l.giocatori || [])[c] ? { testo: "giocatore " + chi, ok: false, perche: "non c'è" }
				: (l.nascosti || []).includes(chi) ? { testo: nomeGiocatore(l, c), ok: false, perche: "è nascosto" }
				: { testo: nomeGiocatore(l, c), ok: true, perche: "è in partita" });
		}
		const arma = o.con && CAT.armi[o.con] ? o.con : null;
		const presa = arma && l.no_weapons ? (l.obiettivo || []).findIndex(q => q.prendi === arma) : -1;
		if (presa >= 0) {
			out.push(presa < i ? { testo: nomeArma(arma), ok: true, perche: "la prende al passo " + (presa + 1) }
				: { testo: nomeArma(arma), ok: false, perche: "la prende solo al passo " + (presa + 1) + ", che viene dopo" });
		} else if (arma && l.no_weapons) {
			const d = arrivaArma(l, arma, i);
			out.push(d < 0 ? { testo: nomeArma(arma), ok: false, perche: "si parte senza armi e nessuna cassa o carta la dà" }
				: d <= i ? { testo: nomeArma(arma), ok: true, perche: "arriva " + quandoArriva(d) }
				: { testo: nomeArma(arma), ok: false, perche: "arriva solo " + quandoArriva(d) + ", troppo tardi" });
		}
		return out;
	});
}
// quello che parte finito il passo k (frasi, casse, carte, Favilla): si sposta col passo
function legatiA(l, k) {
	const n = { frasi: 0, casse: 0, carte: 0, favilla: 0 };
	(l.righe || []).forEach(r => { if (r.quando && r.quando.passo === k) n.frasi++; });
	(l.casse || []).forEach(c => { if (c.dopo === k) n.casse++; });
	(Array.isArray(l.cards) ? l.cards : []).forEach(c => { if (c.dopo === k) n.carte++; });
	if (l.guida && l.guida.parte === k) n.favilla++;
	let mostra = 0;
	(l.dimostra || []).forEach(d => { if (d.quando && d.quando.passo === k) mostra++; });
	return [n.frasi && conta(n.frasi, "frase", "frasi"), n.casse && conta(n.casse, "cassa", "casse"), n.carte && conta(n.carte, "carta", "carte"), n.favilla && "la partenza di Favilla",
		mostra && conta(mostra, "mossa mostrata da Favilla", "mosse mostrate da Favilla")].filter(Boolean);
}

// I quattro tempi di una mossa nuova (Sergio, 6 nov): Favilla spiega, mostra, tocca a te,
// bravo. Per ogni passo con «nuova»: cosa c'è nella finestra dalla mossa nuova di prima
// a questa (lo stesso conto di tempi() in tools/copione/controlla.lua)
function tempi(l) {
	const fuori = {}, passi = l.obiettivo || [];
	let prima = 0;
	const momento = q => q == null ? 0 : q.passo != null ? q.passo : q.turno === 1 ? 0 : null;
	passi.forEach((p, k) => {
		const i = k + 1;
		if (!p.nuova) return;
		const dentro = m => m != null && m >= prima && m <= i - 1;
		const t = { fai: true };
		if (prima === 0 && l.goal_text) t.spiega = true;
		(l.righe || []).forEach(r => {
			if (r.mostra === "grande" && dentro(momento(r.quando))) t.spiega = true;
			if (r.faccia && r.quando && r.quando.passo === i) t.bravo = true;
		});
		if (i === passi.length && l.bravo) t.bravo = true;
		if (l.guida) t.mostra = true;
		(l.dimostra || []).forEach(d => { if (dentro(momento(d.quando))) t.mostra = true; });
		fuori[k] = t;
		prima = i;
	});
	return fuori;
}
const TEMPI = [["spiega", "spiega", "una vignetta grande prima del passo"], ["mostra", "mostra", "Favilla che fa la mossa prima del passo"],
	["fai", "tocca a te", "il passo stesso"], ["bravo", "bravo", "una frase con la faccia quando il passo è fatto (o «Bravo finale» se è l'ultimo)"]];

// ---------------------------------------------------------------- controllo (come tools/copione/controlla.lua)
function problemi(l, c) {
	const out = [];
	const passi = (l.obiettivo || []).length;
	const okPasso = n => n === 0 || (n >= 1 && n <= passi);
	const testo = (t, dove) => {
		if (!t) out.push(dove + ": manca il testo");
		for (const m of String(t || "").matchAll(/\{(\w+)\}/g)) if (!SEGNAPOSTO.includes(m[1])) out.push(dove + ": il gesto {" + m[1] + "} non esiste");
	};
	const cond = (q, dove) => {
		if (!q || !Object.keys(q).length) { out.push(dove + ": manca quando parte"); return; }
		if (q.passo != null && !(q.passo >= 1 && q.passo <= passi)) out.push(dove + ": il passo " + q.passo + " non c'è");
		if (q.evento && !CAT.eventi.includes(q.evento)) out.push(dove + ": l'evento " + q.evento + " non esiste");
		(q.uno || []).forEach((o, i) => cond(o, dove + " (oppure " + (i + 1) + ")"));
	};
	testo(l.titolo, "titolo");
	if (!l.mappa && !l.arena) out.push("manca la mappa");
	(l.obiettivo || []).forEach((p, i) => testo(p.testo, "passo " + (i + 1)));
	dipendenze(l).forEach((ds, i) => ds.forEach(d => { if (!d.ok) out.push("passo " + (i + 1) + ": " + d.testo + " " + d.perche); }));
	for (const [k, t] of Object.entries(tempi(l))) for (const [c, nome] of TEMPI) if (!t[c]) out.push("passo " + (+k + 1) + ": mossa nuova senza «" + nome + "»");
	(l.righe || []).forEach((r, i) => {
		const d = "frase " + (i + 1);
		testo(r.testo, d); cond(r.quando, d + ", quando");
		if (r.fino) cond(r.fino, d + ", fino");
		if (r.mostra === "grande" && !c.aspetta) out.push(d + ": la vignetta grande è delle lezioni");
		if (r.mostra === "grande" && r.highlight && !CAT.disegni.includes(r.highlight)) out.push(d + ": manca il disegno di " + nomeDi(NOMI_COMANDI, r.highlight));
	});
	for (const k of ["casse", "cards"]) (Array.isArray(l[k]) ? l[k] : []).forEach((x, i) => { if (!okPasso(x.dopo)) out.push((k === "casse" ? "cassa " : "carta ") + (i + 1) + ": il passo " + x.dopo + " non c'è"); });
	if (l.arena && (l.spawns || []).length < (l.giocatori || []).length) out.push("ci sono più giocatori che punti di partenza");
	const mi = maestra(l);
	if ((l.dimostra || []).length && mi < 0) out.push("Favilla deve mostrare delle mosse ma non c'è: aggiungila con «+ Favilla che mostra»");
	if (mi >= 0 && l.guida) out.push("ci sono due Favilla, quella che mostra le mosse e quella che corre sul percorso: tienine una");
	if (mi >= 0 && (l.giocatori || [])[0] && l.giocatori[mi].team !== l.giocatori[0].team) out.push("Favilla che mostra deve essere della tua squadra");
	(l.dimostra || []).forEach((d, i) => {
		const dd = "Favilla mostra " + (i + 1);
		if (d.quando) cond(d.quando, dd + ", quando");
		if (!(d.mosse || []).length) out.push(dd + ": nessuna mossa");

}
function idDoppi() {
	const visti = {}, doppi = new Set();

// ---------------------------------------------------------------- Lua (levels.lua e il livello per GIOCA)
const IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;
function luaStr(s) { return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n") + '"'; }
function luaChiave(k) { return /^\d+$/.test(k) ? "[" + k + "]" : IDENT.test(k) ? k : "[" + luaStr(k) + "]"; }
function luaInline(v) {
	if (Array.isArray(v)) return v.length ? "{ " + v.map(luaInline).join(", ") + " }" : "{}";
	if (v && typeof v === "object") {
		const ks = Object.keys(v);
		return ks.length ? "{ " + ks.map(k => luaChiave(k) + " = " + luaInline(v[k])).join(", ") + " }" : "{}";
	}
	if (typeof v === "string") return luaStr(v);
	return String(v);
}
function lua(v, ind) {
	const una = luaInline(v);
	if (una.length + ind.length <= 110 || !(v && typeof v === "object")) return una;
	const dentro = ind + "\t";
	if (Array.isArray(v)) return "{\n" + v.map(x => dentro + lua(x, dentro) + ",\n").join("") + ind + "}";
	return "{\n" + Object.keys(v).map(k => dentro + luaChiave(k) + " = " + lua(v[k], dentro) + ",\n").join("") + ind + "}";
}
function levelsLua() {
	let s = "-- The levels of the campaign, chapter by chapter: all data, the script of\n" +
		"-- each level (sim/missions.lua runs it, docs/copione.md is the format). The\n" +
		"-- Copione (tools/copione) shows and edits them.\n\nlocal M = {}\n";
	for (const c of capitoli) s += "\nM." + c.id + " = " + lua(c.livelli, "") + "\n";
	return s + "\nreturn M\n";
}
function campaignCapitoli() {
	return "M.CAPITOLI = {\n" + capitoli.map(c => "\t" + luaInline({ id: c.id, titolo: c.titolo, serve: c.serve, missioni: "§" + c.id, aspetta: c.aspetta || null })
		.replace('"§' + c.id + '"', "levels." + c.id).replace(", aspetta = null", "") + ",\n").join("") + "}\n";
}
function arenaCambiata(l) {
	const o = ORIGINALI[l.id];
	if (!o || !l.arena) return !!l.arena;
	return JSON.stringify(o.arena) !== JSON.stringify(l.arena);
}

// la camera: viewBox in coordinate dello schermo SVG (y in giù)
function viewBox() {
	const r = tela.box.getBoundingClientRect();
	const asp = r.width / Math.max(1, r.height);
	let { x, y, w, h } = stato.cam;
	if (w / h < asp) { const nw = h * asp; x -= (nw - w) / 2; w = nw; } else { const nh = w / asp; y -= (nh - h) / 2; h = nh; }
	return [x, y, w, h];
}
function puntoMondo(ev) {
	const p = tela.svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
	const q = p.matrixTransform(tela.svg.getScreenCTM().inverse());
	return { x: q.x, y: H - q.y };
}

function terraSotto(l, x, y) {
	let best = 0;
	for (const r of l.arena || []) if (x >= r[0] && x <= r[0] + r[2] && r[1] + r[3] <= y + 1) best = Math.max(best, r[1] + r[3]);
	return best;
}

function disegnaMappa() {
	if (!tela) return;
	const l = liv(), svg = tela.svg, sel = stato.sel || {};
	const [vx, vy, vw, vh] = viewBox();
	svg.setAttribute("viewBox", vx + " " + vy + " " + vw + " " + vh);
	svg.replaceChildren();
	const k = vw / 1000; // dimensione di un "pixel" leggibile
	const defs = sv("defs", {},
		sv("pattern", { id: "griglia", width: 120, height: 120, patternUnits: "userSpaceOnUse" },
			sv("path", { d: "M120 0H0V120", fill: "none", stroke: "#2a231d", "stroke-width": 2 })),
		sv("marker", { id: "freccia", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" },
			sv("path", { d: "M0 0L10 5L0 10z", fill: "#a98ad8" })),
		sv("marker", { id: "frecciaFav", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto-start-reverse" },
			sv("path", { d: "M0 0L10 5L0 10z", fill: "#8ccfef" })),
		sv("marker", { id: "frecciaOro", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto-start-reverse" },
			sv("path", { d: "M0 0L10 5L0 10z", fill: "#e9c35a" })));
	svg.append(defs, sv("rect", { x: -2000, y: -2000, width: W + 4000, height: H + 4000, fill: "#0d0b09", "data-sfondo": "1" }),
		sv("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#griglia)", "data-sfondo": "1" }),
		sv("rect", { x: 0, y: 0, width: W, height: H, fill: "none", stroke: "#3b3129", "stroke-width": 3 * k, "data-sfondo": "1" }));
	const nomeMappa = l.mappa || "missione_" + l.id;
	const img = IMMAGINI.mappe[nomeMappa];
	const vecchio = l.arena && arenaCambiata(l);
	if (img && stato.dipinto) svg.append(sv("image", { href: img, x: 0, y: 0, width: W, height: H, opacity: vecchio ? 0.3 : 1, "data-sfondo": "1", "pointer-events": "none" }));
	const nota = document.getElementById("nota-tela");
	if (nota) nota.textContent = l.arena ? (vecchio ? "Hai cambiato le piattaforme: il disegno è quello vecchio (Claude lo rifà). In GIOCA si vede senza disegno." : "Tocca un oggetto per vedere cos'è, trascinalo per spostarlo. Rotella o due dita: zoom.")
		: "Mappa del gioco (" + ((CAT.mappe[l.mappa] || {}).nome || l.mappa) + "): il terreno è quello del gioco e qui non si cambia.";

	const g = sv("g", {});
	svg.append(g);
	// arena
	if (l.arena && stato.collisioni) l.arena.forEach((r, i) => {
		const s = sel.k === "rect" && sel.i === i;
		g.append(sv("rect", { x: r[0], y: Y(r[1] + r[3]), width: r[2], height: r[3], fill: img && stato.dipinto && !vecchio ? "rgba(140,130,120,.18)" : "#5b5550",
			stroke: s ? "#f0a640" : "#a8998a", "stroke-width": (s ? 3 : 1.5) * k, "data-drag": "rect:" + i, style: "cursor:move" }));
		if (s) {
			g.append(maniglia(r[0] + r[2], r[1] + r[3], "rectTR:" + i, k), maniglia(r[0], r[1], "rectBL:" + i, k));
			g.append(sv("text", { x: r[0] + 6 * k, y: Y(r[1] + r[3]) - 8 * k, "font-size": 14 * k, fill: "#efe4d3", class: "num" }, r[0] + ", " + r[1] + "  " + r[2] + "×" + r[3]));
		}
	});
	// il filo dei passi: dal passo 1 al 2, al 3... (quelli con un posto sulla mappa)
	const tappe = (l.obiettivo || []).map((p, i) => { const q = posPasso(l, p); return q && { x: q.x, y: q.y + 60, i }; }).filter(Boolean);
	for (let j = 1; j < tappe.length; j++) {
		const a = tappe[j - 1], b = tappe[j];
		const mx = (a.x + b.x) / 2, my = Math.max(a.y, b.y) + 120 + Math.abs(a.x - b.x) * 0.08;
		g.append(sv("path", { d: `M${a.x} ${Y(a.y)}Q${mx} ${Y(my)} ${b.x} ${Y(b.y)}`, fill: "none", stroke: "#e9c35a", "stroke-width": 2.5 * k, opacity: .55,
			"stroke-dasharray": (3 * k) + " " + (7 * k), "stroke-linecap": "round", "marker-end": "url(#frecciaOro)", "pointer-events": "none" }));
	}
	// passi
	(l.obiettivo || []).forEach((p, i) => {
		const s0 = sel.k === "passo" && sel.i === i;
		if (p.prendi) {
			const c = (l.casse || []).find(c => c.arma === p.prendi);
			if (c) {
				const yt = terraSotto(l, c.x, H);
				g.append(bollino(c.x + 40, yt + 70, i + 1, "#e9c35a", "passo:" + i, k, s0, "Passo " + (i + 1) + ": prendi la cassa " + nomeArma(p.prendi)),
					etichetta(c.x + 40 + 20 * k, yt + 70, "passo " + (i + 1) + ": prendi", "#e9c35a", k));
			}
		}
		const s = sel.k === "passo" && sel.i === i;
		if (p.reach) {
			const x = p.reach.x, y = p.reach.y;
			g.append(sv("rect", { x, y: Y(y + 260), width: Math.max(0, W - x), height: 260, fill: s ? "rgba(233,195,90,.22)" : "rgba(233,195,90,.10)", stroke: "#e9c35a", "stroke-dasharray": (8 * k) + " " + (6 * k), "stroke-width": 1.5 * k, "pointer-events": "none" }));
			g.append(sv("line", { x1: x, y1: Y(y), x2: x, y2: Y(y + 90), stroke: "#e9c35a", "stroke-width": 3 * k }));
			g.append(sv("path", { d: `M${x} ${Y(y + 90)}l${40 * k} ${12 * k}l${-40 * k} ${12 * k}z`, fill: p.flag ? "#efe4d3" : "#e9c35a" }));
			g.append(bollino(x, y + 90, i + 1, "#e9c35a", "passo:" + i, k, s, "Passo " + (i + 1) + ": arriva qui (trascina la bandierina)"),
				etichetta(x + 48 * k, y + 70, "passo " + (i + 1) + ": arriva qui", "#e9c35a", k));
		}
		const chi = p.hit != null ? p.hit : p.down;
		if (typeof chi === "number") {
			const sp = doveAtterra(l, chi - 1);
			const n = l.obiettivo.slice(0, i).filter(q => (q.hit != null ? q.hit : q.down) === chi).length;
			if (sp) {
				const r = 52 * Math.max(1, k * 0.6);
				g.append(sv("circle", { cx: sp.x, cy: Y(sp.y + 30), r, fill: "none", stroke: "#e9c35a", "stroke-width": 2 * k, "stroke-dasharray": (10 * k) + " " + (6 * k), "pointer-events": "none" }));

	if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? rifai() : annulla(); }
	if (e.key === "Escape" && !document.getElementById("gioca").hidden) chiudiGioca();
	if (rivedendo) { if (e.key === "Escape") chiudiRivedi(); if (e.key === "ArrowRight") passaScena(1); if (e.key === "ArrowLeft") passaScena(-1); }
});
window.addEventListener("resize", () => { if (stato.vista === "livello") disegnaMappa(); });
disegna();
