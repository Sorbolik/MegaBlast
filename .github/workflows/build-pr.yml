# Build di prova dell'APK, solo a mano (Actions > Build di prova > Run workflow,
# scegliendo il ramo): le estensioni native (client/vibra, la WebSocket) si
# compilano solo sul build server di Defold, che dalle sessioni cloud di Claude
# non si raggiunge. Serve a un ramo che tocca un'estensione nativa o il manifest
# del motore. Non firma con la chiave di Sergio e non manda niente. Sulle PR non
# gira più (Sergio, 3 nov): l'APK di main lo costruisce comunque apk.yml.
name: Build di prova
on:
  workflow_dispatch:
concurrency:
  group: build-pr-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Costruisci l'APK
        run: |
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/bob.jar" https://github.com/defold/defold/releases/download/1.14.0/bob.jar
          java -jar "$RUNNER_TEMP/bob.jar" --root client \
            --platform arm64-android --architectures arm64-android \
            --bundle-format apk --variant release --archive \
            --bundle-output "$RUNNER_TEMP/bundle" resolve build bundle
          find "$RUNNER_TEMP/bundle" -name '*.apk' -exec ls -l {} \;
