# Controlli su main (dopo ogni merge) e a mano (Actions > Controlli > Run
# workflow, anche su un ramo prima di una versione online): gli stessi di
# tools/controlli/tutti.sh (sintassi e globali del Lua, controlli
# dell'editor di Defold, tutti i test Lua, go vet, gofmt, go test). Sulle PR
# non girano più, per non rallentare lo sviluppo (Sergio, 3 nov).
name: Controlli
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: controlli-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: LuaJIT
        run: sudo apt-get install -y --no-install-recommends luajit
      - name: Controlli
        run: bash tools/controlli/tutti.sh
