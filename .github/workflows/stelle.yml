# Stelle della campagna: dopo ogni merge su main che cambia le regole
# (client/sim), o a mano su un ramo (Actions > Stelle della campagna > Run
# workflow), i bot rigiocano le missioni dei gironi (strumenti/arena/collaudo.lua)
# e dicono quali stelle non vanno più bene. La tabella va nel riepilogo del
# controllo, le missioni da guardare come avvisi. Non blocca: le soglie si
# cambiano in sim/campaign.lua. Sulle PR non gira più (Sergio, 3 nov).
name: Stelle della campagna

on:
  push:
    branches: [main]
    paths: ['client/sim/**', 'strumenti/arena/collaudo.lua', '.github/workflows/stelle.yml']
  workflow_dispatch:
concurrency:
  group: stelle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collaudo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Collaudo delle missioni
        run: |
          sudo apt-get install -y -qq luajit > /dev/null
          luajit strumenti/arena/collaudo.lua 12 --vita 0.5,1,2 --avvisi
          cat simulazione/arena/collaudo.md >> "$GITHUB_STEP_SUMMARY"
