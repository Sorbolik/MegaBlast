# APK Android firmato con la chiave di Sergio, mandato su Telegram a ogni push su
# main (o a mano da Actions → "APK su Telegram" → Run workflow, anche da un ramo:
# allora didascalia e messaggio cominciano con "🧪 PROVA, NON È MAIN").
# Qui l'estensione WebSocket si compila sul build server di Defold, quindi l'online c'è.
# Solo arm64 (tutti i telefoni da 2017 in poi): con anche armv7 l'APK pesa 70 MB e Telegram
# ne accetta al massimo 50.
# Con "log" spuntato l'APK è la variante debug: il motore scrive i log (le righe
# SCATTO del contatore FPS), che si leggono senza cavo con adb (docs/prestazioni.md).
# Segreti: ANDROID_KEYSTORE (keystore in base64), ANDROID_KEYSTORE_PASS,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. Variabile facoltativa: SERVER_URL.
name: APK su Telegram
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      log:
        description: "APK coi log (variante debug, per leggere gli scatti con adb logcat)"
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read  # novita.py legge la sezione "Per Telegram" delle PR
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100  # per scrivere le novità dalla build precedente
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Costruisci l'APK
        id: build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          VARIANTE: ${{ inputs.log && 'debug' || 'release' }}
        run: |
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/bob.jar" https://github.com/defold/defold/releases/download/1.14.0/bob.jar
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/chiave.keystore"
          printf '%s' "$KEYSTORE_PASS" > "$RUNNER_TEMP/chiave.pass"
          : > "$RUNNER_TEMP/apk.ini"
          [ -n "$SERVER_URL" ] && printf '[megablast]\nserver_url = %s\n' "$SERVER_URL" > "$RUNNER_TEMP/apk.ini"
          java -jar "$RUNNER_TEMP/bob.jar" --root client --settings "$RUNNER_TEMP/apk.ini" \
            --platform arm64-android --architectures arm64-android --strip-executable \
            --bundle-format apk --variant "$VARIANTE" --archive --texture-compression true \
            --keystore "$RUNNER_TEMP/chiave.keystore" --keystore-pass "$RUNNER_TEMP/chiave.pass" \
            --bundle-output "$RUNNER_TEMP/bundle" resolve build bundle
          find "$RUNNER_TEMP/bundle" -name '*.apk' -exec mv {} "$RUNNER_TEMP/MegaBlast.apk" \;
          ls -l "$RUNNER_TEMP/MegaBlast.apk"
          # i bot di Telegram accettano file fino a 50 MB: oltre, si manda il link alla build
          if [ "$(stat -c %s "$RUNNER_TEMP/MegaBlast.apk")" -gt $((49 * 1024 * 1024)) ]; then echo "grande=true" >> "$GITHUB_OUTPUT"; fi
      - name: Conserva l'APK troppo grande per Telegram
        if: steps.build.outputs.grande == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MegaBlast-apk
          path: ${{ runner.temp }}/MegaBlast.apk
          retention-days: 14
      - name: Manda su Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIMA: ${{ github.event.before }}
          RAMO: ${{ github.ref_name }}  # main o il ramo scelto in "Run workflow"
          GITHUB_TOKEN: ${{ github.token }}
          LOG: ${{ inputs.log }}
          GRANDE: ${{ steps.build.outputs.grande }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/apk/novita.py "$PRIMA" "$RAMO" | tee "$RUNNER_TEMP/novita.txt"
          python3 tools/apk/novita.py --didascalia "$RAMO" > "$RUNNER_TEMP/didascalia.txt"
          if [ "$LOG" = "true" ]; then sed -i '1s/^/📋 CON I LOG (debug, solo per le misure) · /' "$RUNNER_TEMP/didascalia.txt"; fi
          cat "$RUNNER_TEMP/didascalia.txt"
          if [ "$GRANDE" = "true" ]; then
            printf '\n⚠️ APK oltre i 50 MB di Telegram: scaricalo da %s (Artifacts)\n' "$RUN_URL" >> "$RUNNER_TEMP/didascalia.txt"
            curl -fsS -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -F "chat_id=$CHAT" -F "text=<$RUNNER_TEMP/didascalia.txt"
          else
            curl -fsS -o /dev/null "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F "chat_id=$CHAT" -F "caption=<$RUNNER_TEMP/didascalia.txt" -F "document=@$RUNNER_TEMP/MegaBlast.apk"
          fi
          curl -fsS -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -F "chat_id=$CHAT" -F "text=<$RUNNER_TEMP/novita.txt"
