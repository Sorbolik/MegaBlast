# APK Android firmato con la chiave di Sergio, mandato su Telegram a ogni push su
# main (o a mano da Actions → "APK su Telegram" → Run workflow, anche da un ramo:
# allora didascalia e messaggio cominciano con "🧪 PROVA, NON È MAIN").
# Qui l'estensione WebSocket si compila sul build server di Defold, quindi l'online c'è.
# Solo arm64 (tutti i telefoni da 2017 in poi): con anche armv7 l'APK pesa 70 MB e Telegram
# ne accetta al massimo 50.
# Con "log" spuntato l'APK è la variante debug: il motore scrive i log (le righe
# SCATTO del contatore FPS), che si leggono senza cavo con adb (docs/prestazioni.md).
# Segreti: ANDROID_KEYSTORE (keystore in base64), ANDROID_KEYSTORE_PASS,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID; facoltativi TELEGRAM_API_ID e TELEGRAM_API_HASH
# (da my.telegram.org: APK come file anche oltre 50 MB). Variabile facoltativa: SERVER_URL
# (dove l'APK cerca il server: il VPS, wss://DOMINIO/ws o ws://IP/ws); a mano si può
# dare un altro server solo per quell'APK (per esempio il PC di casa).
name: APK su Telegram
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      log:
        description: "APK coi log (variante debug, per leggere gli scatti con adb logcat)"
        type: boolean
        default: false
      server_url:
        description: "Server di questo APK (es. ws://192.168.1.9:8080/ws per il PC di casa); vuoto = la variabile SERVER_URL"
        type: string
        default: ""
permissions:
  contents: read
  pull-requests: read  # novita.py legge la sezione "Per Telegram" delle PR
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100  # per scrivere le novità dalla build precedente
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Costruisci l'APK
        id: build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL }}
          VARIANTE: ${{ inputs.log && 'debug' || 'release' }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          RAMO: ${{ github.ref_name }}
        run: |
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/bob.jar" https://github.com/defold/defold/releases/download/1.14.0/bob.jar
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/chiave.keystore"
          printf '%s' "$KEYSTORE_PASS" > "$RUNNER_TEMP/chiave.pass"
          # impronta pubblica del certificato (serve al client Android di «Accedi con Google»)
          keytool -list -v -keystore "$RUNNER_TEMP/chiave.keystore" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -E 'SHA1:|SHA256:' | sort -u || true
          # il codice della versione (come nella didascalia) si vede nelle IMPOSTAZIONI del gioco
          # senza i dipinti HD dei PC (client/paintings_hd): sul telefono non si usano
          printf '[project]\n%s\n\n' "$(grep '^custom_resources' client/game.project | sed 's#,/paintings_hd##')" > "$RUNNER_TEMP/apk.ini"
          printf '[megablast]\nversion = %s\ntest = %s\n' "$(git log -1 --format=%h)" "$([ "$RAMO" = main ] && echo 0 || echo 1)" >> "$RUNNER_TEMP/apk.ini"
          [ -n "$SERVER_URL" ] && printf 'server_url = %s\n' "$SERVER_URL" >> "$RUNNER_TEMP/apk.ini"
          java -jar "$RUNNER_TEMP/bob.jar" --root client --settings "$RUNNER_TEMP/apk.ini" \
            --platform arm64-android --architectures arm64-android --strip-executable \
            --bundle-format apk --variant "$VARIANTE" --archive --texture-compression true \
            --keystore "$RUNNER_TEMP/chiave.keystore" --keystore-pass "$RUNNER_TEMP/chiave.pass" \
            --bundle-output "$RUNNER_TEMP/bundle" resolve build bundle
          find "$RUNNER_TEMP/bundle" -name '*.apk' -exec mv {} "$RUNNER_TEMP/MegaBlast.apk" \;
          ls -l "$RUNNER_TEMP/MegaBlast.apk"
          # i bot di Telegram accettano file fino a 50 MB: oltre, si manda il link alla build,
          # a meno che ci siano TELEGRAM_API_ID e TELEGRAM_API_HASH (server dei bot locale, fino a 2 GB)
          if [ "$(stat -c %s "$RUNNER_TEMP/MegaBlast.apk")" -gt $((49 * 1024 * 1024)) ] && [ -z "$API_ID" ]; then echo "grande=true" >> "$GITHUB_OUTPUT"; fi
      - name: Conserva l'APK troppo grande per Telegram
        if: steps.build.outputs.grande == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MegaBlast-apk
          path: ${{ runner.temp }}/MegaBlast.apk
          retention-days: 14
      # Server dei bot di Telegram sul runner (immagine ufficiale ricompilata da aiogram): coi
      # segreti TELEGRAM_API_ID e TELEGRAM_API_HASH (da my.telegram.org) manda file fino a 2 GB,
      # quindi l'APK arriva sempre come file anche oltre i 50 MB del server normale.
      - name: Server dei bot locale (file oltre 50 MB)
        id: locale
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then echo "url=https://api.telegram.org" >> "$GITHUB_OUTPUT"; exit 0; fi
          docker run -d --name botapi -p 8081:8081 -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -e TELEGRAM_API_ID="$API_ID" -e TELEGRAM_API_HASH="$API_HASH" -e TELEGRAM_LOCAL=1 aiogram/telegram-bot-api:latest
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8081 && break; sleep 1; done
          echo "url=http://127.0.0.1:8081" >> "$GITHUB_OUTPUT"
      - name: Manda su Telegram
        env:
          API: ${{ steps.locale.outputs.url }}
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIMA: ${{ github.event.before }}
          RAMO: ${{ github.ref_name }}  # main o il ramo scelto in "Run workflow"
          GITHUB_TOKEN: ${{ github.token }}
          LOG: ${{ inputs.log }}
          GRANDE: ${{ steps.build.outputs.grande }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/apk/novita.py "$PRIMA" "$RAMO" | tee "$RUNNER_TEMP/novita.txt"
          python3 tools/apk/novita.py --didascalia "$RAMO" > "$RUNNER_TEMP/didascalia.txt"
          if [ "$LOG" = "true" ]; then sed -i '1s/^/📋 CON I LOG (debug, solo per le misure) · /' "$RUNNER_TEMP/didascalia.txt"; fi
          cat "$RUNNER_TEMP/didascalia.txt"
          if [ "$GRANDE" = "true" ]; then
            printf '\n⚠️ APK oltre i 50 MB di Telegram: scaricalo da %s (Artifacts)\n' "$RUN_URL" >> "$RUNNER_TEMP/didascalia.txt"
            curl -fsS -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -F "chat_id=$CHAT" -F "text=<$RUNNER_TEMP/didascalia.txt"
          else
            curl -fsS -o /dev/null "$API/bot$TOKEN/sendDocument" \
              -F "chat_id=$CHAT" -F "caption=<$RUNNER_TEMP/didascalia.txt" -F "document=@$RUNNER_TEMP/MegaBlast.apk"
          fi
          curl -fsS -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -F "chat_id=$CHAT" -F "text=<$RUNNER_TEMP/novita.txt"
