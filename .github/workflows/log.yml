# Log del server sul VPS: stampa le righe di journalctl -u megablast che
# contengono un testo, in un intervallo di tempo. Serve ai thread di Claude, che
# non raggiungono il VPS: Actions > Log del server > Run workflow (o
# workflow_dispatch con gli input "testo" e "da"), poi si legge il log della corsa.
# Stessi segreto e variabile di "Server sul VPS" (tools/vps/README.md).
name: Log del server
on:
  workflow_dispatch:
    inputs:
      testo:
        description: "Righe che contengono questo testo (vuoto = tutte)"
        type: string
        default: "ricetta da"
      da:
        description: "Da quando, come lo capisce journalctl --since (es. -1h, -30min, today, 2026-11-18 06:00)"
        type: string
        default: "-1h"
      a:
        description: "Fino a quando (journalctl --until; vuoto = adesso)"
        type: string
        default: ""
      prova:
        description: "Prova anche POST /ricetta (dal VPS e da fuori) e mostra Caddyfile, errori di Caddy e richieste a /ricetta"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leggi il log
        env:
          CHIAVE: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          TESTO: ${{ inputs.testo }}
          DA: ${{ inputs.da }}
          A: ${{ inputs.a }}
        run: |
          [ -n "$CHIAVE" ] && [ -n "$VPS_HOST" ] || { echo "manca VPS_SSH_KEY o VPS_HOST"; exit 1; }
          install -m 600 /dev/null "$RUNNER_TEMP/chiave"
          printf '%s\n' "$CHIAVE" > "$RUNNER_TEMP/chiave"
          # gli input passano al VPS già quotati: nessun testo diventa un comando
          cmd="journalctl -u megablast --no-pager -o short-iso --since $(printf %q "$DA")"
          [ -n "$A" ] && cmd="$cmd --until $(printf %q "$A")"
          [ -n "$TESTO" ] && cmd="$cmd | grep -F -- $(printf %q "$TESTO")"
          ssh -i "$RUNNER_TEMP/chiave" -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" "$cmd | tail -n 2000" || echo "(nessuna riga)"
          if [ "${{ inputs.prova }}" = true ]; then
            echo "== da fuori (runner di GitHub) verso Caddy"
            curl -sS -i -m 20 -X POST --data prova "http://$VPS_HOST/ricetta?p=prova-fuori&j=curl" | head -20 || true
            ssh -i "$RUNNER_TEMP/chiave" "root@$VPS_HOST" 'echo "== dal VPS verso Caddy (porta 80)"
          curl -sS -i -m 20 -X POST --data prova "http://49.13.44.34/ricetta?p=prova-vps&j=curl" | head -20
          echo "== dal VPS direttamente al server (8080)"
          curl -sS -i -m 20 -X POST --data prova "http://127.0.0.1:8080/ricetta?p=prova-8080&j=curl" | head -20
          echo "== Caddyfile"; cat /etc/caddy/Caddyfile
          echo "== versione del server"; ls -l /opt/megablast/megablast-server; systemctl status megablast --no-pager -n 0 | head -5
          echo "== errori di Caddy da oggi"; journalctl -u caddy --no-pager -o short-iso --since today | tail -n 50
          echo "== richieste a /ricetta (log di accesso di Caddy)"; cat /var/log/caddy/megablast*.log 2>/dev/null | grep -F "\"/ricetta" | tail -n 50
          echo "== righe del server con ricetta da oggi"; journalctl -u megablast --no-pager -o short-iso --since today | grep -i ricetta | tail -n 50' || true
          fi
          rm -f "$RUNNER_TEMP/chiave"
