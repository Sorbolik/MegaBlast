# Il Copione su Cloudflare (Worker megablast-copione, strumenti/copione/cloudflare).
# Cloudflare lo pubblica come gli altri strumenti (repository collegato), ma dal
# ramo copione-pubblica, già costruito: la build web del gioco per GIOCA vuole
# Java e bob.jar, che la build di Cloudflare non ha. Questo workflow, dopo ogni
# merge su main che tocca il gioco o il Copione, rifà pagina e build
# (costruisci.sh) e riscrive il ramo copione-pubblica con un solo commit:
# wrangler.jsonc, worker.js e dist/. A mano: Actions > Copione > Run workflow.
name: Copione
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'strumenti/copione/**'
      - 'strumenti/web/**'
      - '.github/workflows/copione.yml'
  workflow_dispatch:
concurrency:
  group: copione
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  copione:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: LuaJIT, Pillow e bob.jar
        run: |
          sudo apt-get install -y --no-install-recommends luajit
          pip install --quiet pillow
          mkdir -p "$RUNNER_TEMP/cache"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/cache/bob.jar" https://github.com/defold/defold/releases/download/1.14.0/bob.jar
      - name: Pagina e build web
        env:
          MEGABLAST_CACHE: ${{ runner.temp }}/cache
        run: JAVA="$(command -v java)" sh strumenti/copione/cloudflare/costruisci.sh
      - name: Ramo copione-pubblica
        run: |
          P="$RUNNER_TEMP/pubblica"
          mkdir -p "$P"
          cp -r strumenti/copione/cloudflare/wrangler.jsonc strumenti/copione/cloudflare/worker.js strumenti/copione/cloudflare/dist "$P/"
          cd "$P"
          git init -q -b copione-pubblica
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Copione costruito da main ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" copione-pubblica
