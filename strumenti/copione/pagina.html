<title>Copione di MegaBlast</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden] { display: none !important; }
/* Banco del fabbro: la mappa del livello al centro come un'incudine sotto la lampada,
   strumenti attorno; la pergamena solo dove parla un personaggio (come nel gioco). */
:root {
	color-scheme: dark;
	--fondo: #15120f;        /* la forgia spenta */
	--banco: #1f1a16;        /* i pannelli */
	--banco2: #2a231d;
	--riga: #3b3129;
	--testo: #efe4d3;
	--tenue: #a8998a;
	--brace: #f0a640;        /* accento: il metallo caldo */
	--oro: #e9c35a;          /* il testo d'oro degli obiettivi */
	--pergamena: #f2e1bf;
	--inchiostro: #1f120c;
	--blu: #6fa8d6;          /* squadra 1 */
	--rosso: #d9674b;        /* squadra 2 */
	--grigio: #8e8478;       /* fantocci */
	--viola: #a98ad8;        /* eventi senza posto */
	--verde: #7fbf7a;
	--errore: #ff7a66;
	--f-titolo: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
	--f-testo: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
	--f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--fondo); color: var(--testo); font-family: var(--f-testo); font-size: 14px;
	padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 0; display: flex; flex-direction: column; overflow-x: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--banco2); border: 1px solid var(--riga); border-radius: 6px; padding: 6px 10px; }
button:hover { border-color: var(--brace); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brace); outline-offset: 1px; }
button.caldo { background: var(--brace); color: var(--inchiostro); border-color: var(--brace); font-weight: 700; }
button.piccolo { padding: 3px 7px; font-size: 12px; }
button[disabled] { opacity: .4; cursor: default; }
select, input, textarea { background: var(--fondo); border: 1px solid var(--riga); border-radius: 5px; padding: 5px 7px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--tenue); }
label.riga { flex-direction: row; align-items: center; gap: 6px; color: var(--testo); font-size: 13px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

header.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--riga); }
header .marchio { font-family: var(--f-titolo); font-size: 22px; letter-spacing: .5px; color: var(--brace); cursor: pointer; }
header .briciole { color: var(--tenue); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .briciole b { color: var(--testo); font-weight: 700; }
header .azioni { display: flex; flex-wrap: wrap; gap: 6px; }
#avviso { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
	background: var(--banco2); border: 1px solid var(--brace); padding: 8px 14px; border-radius: 8px; z-index: 50; max-width: 90vw; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Cruscotto */
.cruscotto { padding-block: 16px; display: flex; flex-direction: column; gap: 22px; overflow: auto; }
.capitolo h2 { font-family: var(--f-titolo); font-weight: 400; font-size: 20px; margin: 0; text-wrap: balance; }
.capitolo .testa { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.capitolo .testa .info { color: var(--tenue); font-size: 13px; }
.carte { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.carta { background: var(--banco); border: 1px solid var(--riga); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0; }
.carta:hover { border-color: var(--brace); }
.carta .mini { aspect-ratio: 16 / 9; max-width: 100%; background: #0d0b09; display: block; }
.carta .corpo { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
.carta .tit { font-weight: 700; font-size: 15px; }
.carta .meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 11.5px; color: var(--tenue); }
.pill { border: 1px solid var(--riga); border-radius: 99px; padding: 1px 7px; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
.pill.grande { border-color: var(--brace); color: var(--brace); }
.pill.err { border-color: var(--errore); color: var(--errore); }
.carta .mosse { display: flex; gap: 4px; padding: 0 10px 10px; }
.nuova { border: 1px dashed var(--riga); border-radius: 8px; display: grid; place-items: center; min-height: 120px; color: var(--tenue); background: none; }

/* Editor */
.editor { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr) auto; gap: 0 12px; padding-block: 10px; }
.tela { position: relative; background: #0d0b09; border: 1px solid var(--riga); border-radius: 8px; overflow: hidden; min-height: 300px; touch-action: none; }
.tela svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.strumenti { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 5px; max-width: calc(100% - 16px); }
.strumenti button { background: rgba(31, 26, 22, .9); font-size: 12px; padding: 4px 8px; }
.strumenti button.on { border-color: var(--brace); color: var(--brace); }
.nota-tela { position: absolute; right: 8px; bottom: 8px; background: rgba(31, 26, 22, .9); border: 1px solid var(--riga); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--tenue); max-width: 60%; }
.pannello { grid-row: 1 / span 2; grid-column: 2; background: var(--banco); border: 1px solid var(--riga); border-radius: 8px; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pannello h3 { font-family: var(--f-titolo); font-weight: 400; font-size: 17px; margin: 0; }
.pannello .gruppo { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--riga); padding-top: 10px; }
.pannello .due { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pannello .quattro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pannello .bottoni { display: flex; flex-wrap: wrap; gap: 6px; }
.scelte { display: flex; flex-wrap: wrap; gap: 4px; }
.scelte label { flex-direction: row; align-items: center; gap: 4px; border: 1px solid var(--riga); border-radius: 99px; padding: 2px 8px; color: var(--testo); font-size: 12px; }
.cond { border: 1px solid var(--riga); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.cond .r { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.cond .r select, .cond .r input { flex: 1; min-width: 70px; }
.cond .o { border-left: 3px solid var(--viola); padding-left: 6px; display: flex; flex-direction: column; gap: 5px; }
.problemi { color: var(--errore); font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }

/* striscia del tempo */
.tempo { grid-column: 1; margin-top: 10px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; max-height: 38vh; }
.colonna { flex: 0 0 200px; background: var(--banco); border: 1px solid var(--riga); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.colonna.su { border-color: var(--brace); }
.colonna .capo { font-size: 11.5px; color: var(--tenue); text-transform: uppercase; letter-spacing: .5px; }
.colonna .obb { color: var(--oro); font-weight: 700; font-size: 13px; cursor: pointer; }
.colonna .obb.sel { text-decoration: underline; }
.gettone { background: var(--banco2); border: 1px solid var(--riga); border-left: 4px solid var(--tenue); border-radius: 6px; padding: 5px 7px; font-size: 12.5px; cursor: grab; text-align: left; }
.gettone.grande { border-left-color: var(--brace); }
.gettone.striscia { border-left-color: var(--blu); }
.gettone.cassa { border-left-color: var(--verde); }
.gettone.sel { outline: 2px solid var(--brace); }
.gettone .chi { font-size: 10.5px; color: var(--tenue); text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; gap: 6px; }
.gettone .q { font-size: 11px; color: var(--viola); }
.colonna .piu { font-size: 12px; color: var(--tenue); background: none; border-style: dashed; }

/* vignetta come nel gioco */
.vignetta { background: var(--pergamena); color: var(--inchiostro); border: 3px solid var(--inchiostro); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: 74px 1fr; gap: 10px; }
.vignetta img { width: 74px; height: 74px; object-fit: contain; }
.vignetta .nome { font-family: var(--f-titolo); font-size: 13px; }
.vignetta .frase { font-family: var(--f-titolo); font-size: 14px; line-height: 1.25; }
.vignetta .disegno { grid-column: 1 / -1; background: #1c1820; color: var(--testo); border-radius: 4px; padding: 10px; display: flex; gap: 8px; align-items: center; font-size: 12px; }
.vignetta .disegno img { width: 32px; height: 32px; }
.vignetta .vai { grid-column: 1; background: var(--inchiostro); color: var(--pergamena); font-family: var(--f-titolo); text-align: center; border-radius: 3px; padding: 4px; }
.striscia-ant { background: rgba(10, 9, 12, .85); border: 1px solid var(--riga); border-radius: 6px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.striscia-ant img { width: 40px; height: 40px; object-fit: contain; }

/* GIOCA */
#gioca { position: fixed; inset: 0; background: rgba(0, 0, 0, .92); z-index: 40; display: flex; flex-direction: column;
	padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
#gioca .su { display: flex; gap: 8px; align-items: center; }
#gioca .su span { flex: 1; color: var(--tenue); }
#gioca iframe { flex: 1; border: 0; width: 100%; background: #000; border-radius: 6px; }
.conferma { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--errore); font-size: 12.5px; }

@media (max-width: 900px) {
	html, body { height: auto; }
	.editor { flex: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto auto; }
	.pannello { grid-row: 3; grid-column: 1; margin-top: 10px; overflow: visible; }
	.tempo { grid-row: 2; max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

	<div class="su"><span id="gioca-nome"></span><button id="gioca-ancora">Ricomincia</button><button id="gioca-chiudi" class="caldo">Chiudi</button></div>

</script>
<script>
"use strict";
// ---------------------------------------------------------------- dati
const W = DATI.catalogo.mondo.w, H = DATI.catalogo.mondo.h;
const CAT = DATI.catalogo;
const ARMI = Object.keys(CAT.armi).sort();
const COMANDI = ["primaria", "secondaria", "cammina", "salta", "mira", "annulla", "baratto", ...ARMI];
const VEDI = ["primarie", "secondarie", "teleport", "parachute", "tempo", "punti", "baratto", ...ARMI.filter(w => w !== "teleport" && w !== "parachute")];
const TIPI = ["corsa", "bersagli", "duello", "squadra", "orda", "resistenza", "bottino", "custode"];
const USA = ["globi", "rampino", "pogo", "kickback", "paracadute", "baratto"];
const SEGNAPOSTO = ["salta", "cammina", "mira", "annulla"];
const CONTATORI = ["morti", "teletrasporti", "vuoto", "abbattuti", "danni", "misses", "globi", "globi_turno", "scintille", "prima"];
const BASE = JSON.stringify(DATI.capitoli);
const ORIGINALI = {};
for (const c of DATI.capitoli) for (const l of c.livelli) ORIGINALI[l.id] = l;

const clone = v => JSON.parse(JSON.stringify(v));
let capitoli = clone(DATI.capitoli);
let stato = { vista: "cruscotto", c: 0, l: 0, sel: null, cam: null, dipinto: true, collisioni: true };
let passato = [], futuro = [];

const BOZZA = "copione_bozza_v1";
try {
	const b = JSON.parse(localStorage.getItem(BOZZA) || "null");
	if (b && b.base === BASE && Array.isArray(b.capitoli)) capitoli = b.capitoli;
} catch (e) { /* senza memoria del browser si parte dal gioco */ }
function conta(n, uno, tanti) { return n + " " + (n === 1 ? uno : tanti); }
function salvaBozza() {
	try { localStorage.setItem(BOZZA, JSON.stringify({ base: BASE, capitoli })); } catch (e) { /* niente */ }
}

const cap = () => capitoli[stato.c];
const liv = () => cap().livelli[stato.l];

function segna() { // prima di ogni modifica: per annullare
	passato.push(JSON.stringify(capitoli));
	if (passato.length > 200) passato.shift();
	futuro = [];
}
function cambiato() { salvaBozza(); disegna(); }
function annulla() { if (!passato.length) return; futuro.push(JSON.stringify(capitoli)); capitoli = JSON.parse(passato.pop()); stato.sel = null; aggiusta(); cambiato(); }
function rifai() { if (!futuro.length) return; passato.push(JSON.stringify(capitoli)); capitoli = JSON.parse(futuro.pop()); stato.sel = null; aggiusta(); cambiato(); }
function aggiusta() {
	stato.c = Math.min(stato.c, capitoli.length - 1);
	stato.l = Math.min(stato.l, Math.max(0, cap().livelli.length - 1));
	if (!cap().livelli.length) stato.vista = "cruscotto";
}

function avviso(t) {
	const a = document.getElementById("avviso");
	a.textContent = t; a.hidden = false;
	clearTimeout(avviso.t); avviso.t = setTimeout(() => { a.hidden = true; }, 3200);
}

// ---------------------------------------------------------------- piccoli aiuti
function metti(n, ...figli) { n.append(...figli.flat().filter(f => f != null && f !== false)); return n; }
function el(tag, props, ...figli) {
	const n = document.createElement(tag);
	for (const [k, v] of Object.entries(props || {})) {
		if (v == null || v === false) continue;
		if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
		else if (k === "class") n.className = v;
		else if (k === "text") n.textContent = v;
		else n.setAttribute(k, v === true ? "" : v);
	}
	for (const f of figli.flat()) if (f != null && f !== false) n.append(f.nodeType ? f : document.createTextNode(String(f)));
	return n;
}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...figli) {
	const n = document.createElementNS(NS, tag);
	for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
	for (const f of figli.flat()) if (f != null) n.append(f.nodeType ? f : document.createTextNode(String(f)));
	return n;
}
const snap = v => Math.round(v / 10) * 10;
const Y = y => H - y;

function nomeArma(w) { return (CAT.armi[w] && CAT.armi[w].nome) || w; }
function chiParla(c) { return c.aspetta ? "favilla" : "fabbro"; }
function ritratto(chi, faccia) {
	return IMMAGINI.ritratti[chi + "_" + (faccia || "spiega")] || IMMAGINI.ritratti[chi + "_calma"] || "";
}
function conGesti(t) { return String(t || "").replace(/\{(\w+)\}/g, (m, k) => CAT.gesti[k] || m); }

function nomeGiocatore(l, i) {
	const g = (l.giocatori || [])[i] || {};
	if (i === 0) return "Tu";
	if (g.nome) return g.nome;
	if (g.dummy) return "Fantoccio " + (i + 1);
	if (g.bot) return "Bot " + g.bot + (g.carattere ? " " + g.carattere : "");
	return "Giocatore " + (i + 1);
}
function coloreGiocatore(l, i) {
	const g = (l.giocatori || [])[i] || {};
	if (g.dummy) return "var(--grigio)";
	return g.team === 2 ? "var(--rosso)" : "var(--blu)";
}

// un trigger in parole
function frase(q) {
	if (!q) return "";
	const p = [];
	if (q.passo != null) p.push("dopo il passo " + q.passo);
	if (q.turno != null) p.push("tuo turno " + q.turno);
	if (q.turno_altri != null) p.push("turno " + q.turno_altri + " degli altri");
	if (q.di_turno) p.push(q.di_turno === "tu" ? "nel tuo turno" : "nel turno degli altri");
	if (q.evento) p.push("evento " + q.evento + (q.di ? " (" + q.di + ")" : "") + (q.arma ? " con " + nomeArma(q.arma) : ""));
	if (q.tocca) p.push("tocchi " + q.tocca);
	if (q.usato) p.push("hai usato " + q.usato);
	if (q.finestra) p.push("dopo il primo attacco");
	if (q.in_caduta) p.push("cadi veloce");
	if (q.corona) p.push("sei primo");
	if (q.conta) p.push(q.conta + " ≥ " + (q.almeno || 1));
	if (q.uno) p.push("uno fra: " + q.uno.map(frase).join(" | "));
	return p.join(", ");
}
// la riga parte da un passo e basta: va nella colonna di quel passo
function soloPasso(q) { return q && Object.keys(q).length === 1 && q.passo != null; }

// ---------------------------------------------------------------- controllo (come strumenti/copione/controlla.lua)
function problemi(l, c) {
	const out = [];
	const passi = (l.obiettivo || []).length;
	const okPasso = n => n === 0 || (n >= 1 && n <= passi);
	const testo = (t, dove) => {
		if (!t) out.push(dove + ": manca il testo");
		for (const m of String(t || "").matchAll(/\{(\w+)\}/g)) if (!SEGNAPOSTO.includes(m[1])) out.push(dove + ": segnaposto {" + m[1] + "}");
	};
	const cond = (q, dove) => {
		if (!q || !Object.keys(q).length) { out.push(dove + ": condizione vuota"); return; }
		if (q.passo != null && !(q.passo >= 1 && q.passo <= passi)) out.push(dove + ": il passo " + q.passo + " non c'è");
		if (q.evento && !CAT.eventi.includes(q.evento)) out.push(dove + ": evento " + q.evento + " sconosciuto");
		(q.uno || []).forEach((o, i) => cond(o, dove + " (oppure " + (i + 1) + ")"));
	};
	testo(l.titolo, "titolo");
	if (!l.mappa && !l.arena) out.push("serve una mappa o un'arena");
	(l.obiettivo || []).forEach((p, i) => testo(p.testo, "passo " + (i + 1)));
	(l.righe || []).forEach((r, i) => {
		const d = "riga " + (i + 1);
		testo(r.testo, d); cond(r.quando, d + ", quando");
		if (r.fino) cond(r.fino, d + ", fino");
		if (r.mostra === "grande" && !c.aspetta) out.push(d + ": la vignetta grande è delle lezioni");
		if (r.mostra === "grande" && r.highlight && !CAT.disegni.includes(r.highlight)) out.push(d + ": manca il disegno di " + r.highlight);
	});
	for (const k of ["casse", "cards"]) (l[k] || []).forEach((x, i) => { if (!okPasso(x.dopo)) out.push(k + " " + (i + 1) + ": il passo " + x.dopo + " non c'è"); });
	if (l.arena && (l.spawns || []).length < (l.giocatori || []).length) out.push("meno punti di partenza che giocatori");
	return out;
}
function idDoppi() {
	const visti = {}, doppi = new Set();
	for (const c of capitoli) for (const l of c.livelli) { if (visti[l.id]) doppi.add(l.id); visti[l.id] = true; }
	return doppi;
}

// ---------------------------------------------------------------- Lua (levels.lua e il livello per GIOCA)
const IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;
function luaStr(s) { return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n") + '"'; }
function luaChiave(k) { return /^\d+$/.test(k) ? "[" + k + "]" : IDENT.test(k) ? k : "[" + luaStr(k) + "]"; }
function luaInline(v) {
	if (Array.isArray(v)) return v.length ? "{ " + v.map(luaInline).join(", ") + " }" : "{}";
	if (v && typeof v === "object") {
		const ks = Object.keys(v);
		return ks.length ? "{ " + ks.map(k => luaChiave(k) + " = " + luaInline(v[k])).join(", ") + " }" : "{}";
	}
	if (typeof v === "string") return luaStr(v);
	return String(v);
}
function lua(v, ind) {
	const una = luaInline(v);
	if (una.length + ind.length <= 110 || !(v && typeof v === "object")) return una;
	const dentro = ind + "\t";
	if (Array.isArray(v)) return "{\n" + v.map(x => dentro + lua(x, dentro) + ",\n").join("") + ind + "}";
	return "{\n" + Object.keys(v).map(k => dentro + luaChiave(k) + " = " + lua(v[k], dentro) + ",\n").join("") + ind + "}";
}
function levelsLua() {
	let s = "-- The levels of the campaign, chapter by chapter: all data, the script of\n" +
		"-- each level (sim/missions.lua runs it, docs/copione.md is the format). The\n" +
		"-- Copione (strumenti/copione) shows and edits them.\n\nlocal M = {}\n";
	for (const c of capitoli) s += "\nM." + c.id + " = " + lua(c.livelli, "") + "\n";

}
function campaignCapitoli() {

}
function arenaCambiata(l) {

// ---------------------------------------------------------------- disegno generale

	br.replaceChildren();

// ---------------------------------------------------------------- cruscotto
function cruscotto() {

		const carte = el("div", { class: "carte" });
		c.livelli.forEach((l, li) => {
			const pr = problemi(l, c);
			const grandi = (l.righe || []).filter(r => r.mostra === "grande").length + (l.goal_text ? 1 : 0);
			const img = IMMAGINI.mappe[l.mappa || "missione_" + l.id];
			const apri = () => { stato.vista = "livello"; stato.c = ci; stato.l = li; stato.sel = null; stato.cam = null; disegna(); };
			const sposta = (d) => (e) => {
				e.stopPropagation();

						el("span", { class: "pill grande", text: conta(grandi, "vignetta grande", "vignette grandi") }),
						el("span", { class: "pill", text: conta((l.righe || []).length, "riga", "righe") }),

// la camera: viewBox in coordinate dello schermo SVG (y in giù)
function viewBox() {
	const r = tela.box.getBoundingClientRect();
	const asp = r.width / Math.max(1, r.height);
	let { x, y, w, h } = stato.cam;
	if (w / h < asp) { const nw = h * asp; x -= (nw - w) / 2; w = nw; } else { const nh = w / asp; y -= (nh - h) / 2; h = nh; }
	return [x, y, w, h];
}
function puntoMondo(ev) {
	const p = tela.svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
	const q = p.matrixTransform(tela.svg.getScreenCTM().inverse());
	return { x: q.x, y: H - q.y };
}

function terraSotto(l, x, y) {
	let best = 0;
	for (const r of l.arena || []) if (x >= r[0] && x <= r[0] + r[2] && r[1] + r[3] <= y + 1) best = Math.max(best, r[1] + r[3]);
	return best;
}

function posPasso(l, p) {

// trascinare, scorrere, ingrandire
function agganciaTela(svg) {
	const dita = new Map();
	let presa = null; // { chiave, inizio, orig, segnato }
	let pan = null, pinch = null;
	svg.addEventListener("pointerdown", ev => {
		svg.setPointerCapture(ev.pointerId);
		dita.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
		if (dita.size === 2) { presa = null; pan = null; const [a, b] = [...dita.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cam: { ...stato.cam } }; return; }
		const t = ev.target.closest("[data-drag]");
		if (t) {
			const [tipo, i] = t.getAttribute("data-drag").split(":");
			presa = { tipo, i: +i, inizio: puntoMondo(ev), orig: JSON.stringify(liv()), mosso: false };
			const kind = { rect: "rect", rectTR: "rect", rectBL: "rect", spawn: "spawn", selspawn: "spawn", passo: "passo", cassa: "cassa", guida: "guida", scintilla: "scintilla", selriga: "riga" }[tipo];
			stato.sel = kind === "scintilla" ? { k: kind } : { k: kind, i: +i };
			disegnaMappa(); disegnaPannello(); disegnaTempo();
			presa.inizio = puntoMondo(ev); // il pannello può aver cambiato la misura della tela
		} else {
			stato.sel = null;
			pan = { x: ev.clientX, y: ev.clientY, cam: { ...stato.cam }, mosso: false };
		}
	});
	svg.addEventListener("pointermove", ev => {
		if (!dita.has(ev.pointerId)) return;
		dita.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
		if (pinch && dita.size === 2) {
			const [a, b] = [...dita.values()];
			const f = pinch.d / Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));
			zoomA(pinch.cam, f, pinch.cam.x + pinch.cam.w / 2, pinch.cam.y + pinch.cam.h / 2);
			return;
		}
		if (presa) {
			const p = puntoMondo(ev), l = liv();
			const dx = snap(p.x - presa.inizio.x), dy = snap(p.y - presa.inizio.y);
			if (!presa.mosso && Math.abs(dx) + Math.abs(dy) === 0) return;
			if (!presa.mosso) { passato.push(JSON.stringify(capitoli)); futuro = []; presa.mosso = true; }
			const o = JSON.parse(presa.orig), i = presa.i;
			if (presa.tipo === "rect") { l.arena[i][0] = o.arena[i][0] + dx; l.arena[i][1] = Math.max(0, o.arena[i][1] + dy); }
			if (presa.tipo === "rectTR") { l.arena[i][2] = Math.max(10, o.arena[i][2] + dx); l.arena[i][3] = Math.max(10, o.arena[i][3] + dy); }
			if (presa.tipo === "rectBL") {
				const r = o.arena[i], nx = Math.min(r[0] + r[2] - 10, r[0] + dx), ny = Math.max(0, Math.min(r[1] + r[3] - 10, r[1] + dy));
				l.arena[i] = [nx, ny, r[0] + r[2] - nx, r[1] + r[3] - ny];
			}
			if (presa.tipo === "spawn") { l.spawns[i].x = o.spawns[i].x + dx; l.spawns[i].from = Math.max(0, o.spawns[i].from + dy); }
			if (presa.tipo === "passo") {
				const pp = o.obiettivo[i];
				if (pp.reach) { l.obiettivo[i].reach.x = pp.reach.x + dx; l.obiettivo[i].reach.y = Math.max(0, pp.reach.y + dy); }
			}
			if (presa.tipo === "cassa") l.casse[i].x = Math.max(0, Math.min(W, o.casse[i].x + dx));
			if (presa.tipo === "guida") { const q = o.guida.percorso[i]; l.guida.percorso[i].x = q.x + dx; l.guida.percorso[i].y = Math.max(0, q.y + dy); }
			if (presa.tipo === "scintilla") { l.scintilla.x = o.scintilla.x + dx; l.scintilla.y = o.scintilla.y + dy; }
			disegnaMappa();
			return;
		}
		if (pan) {
			const r = tela.box.getBoundingClientRect();
			const [, , vw] = viewBox();
			const f = vw / r.width;
			stato.cam.x = pan.cam.x - (ev.clientX - pan.x) * f;
			stato.cam.y = pan.cam.y - (ev.clientY - pan.y) * f;
			disegnaMappa();
		}
	});
	const fine = ev => {
		dita.delete(ev.pointerId);
		if (presa && presa.mosso) {
			salvaBozza(); disegnaPannello(); disegnaTempo();
			document.getElementById("annulla").disabled = false; document.getElementById("rifai").disabled = true;
		}
		if (dita.size < 2) pinch = null;
		if (pan && dita.size === 0) { disegnaPannello(); disegnaTempo(); }
		presa = null; pan = null;
	};
	svg.addEventListener("pointerup", fine);
	svg.addEventListener("pointercancel", fine);
	svg.addEventListener("wheel", ev => {
		ev.preventDefault();
		const p = puntoMondo(ev);
		zoomA(stato.cam, Math.exp(ev.deltaY * 0.0015), p.x, H - p.y);
	}, { passive: false });
}

	stato.cam = { x: cx - fx * w, y: cy - fy * h, w, h };
	disegnaMappa();

		const verbo = ["reach", "prendi", "hit", "down", "usa", "win"].find(v => v in o) || "reach";
		const vs = el("select", { id: "f-verbo" });
		for (const [v, t] of [["reach", "Arriva qui"], ["prendi", "Prendi la cassa"], ["hit", "Colpisci"], ["down", "Abbatti"], ["usa", "Usa una mossa"], ["win", "Vinci la partita"]]) vs.append(el("option", { value: v }, t));
		vs.value = verbo;
		vs.addEventListener("change", () => {
			segna(); for (const v of ["reach", "prendi", "hit", "down", "usa", "win", "con", "come", "times", "flag"]) delete o[v];
			o[vs.value] = { reach: { x: 900, y: 150 }, prendi: "missile", hit: 2, down: 2, usa: "globi", win: true }[vs.value]; rid();
		});
		const robot = (l.giocatori || []).map((_, i) => [i + 1, (i + 1) + ". " + nomeGiocatore(l, i)]).slice(1);
		metti(p, el("h3", { text: "Passo " + (s.i + 1) }),
			campo("La scritta d'oro", testoIn(o, "testo")),
			campo("Si fa quando", vs));
		if (verbo === "reach") metti(p, el("div", { class: "due" }, campo("x", testoIn(o.reach, "x", { num: true, id: "r" })), campo("y", testoIn(o.reach, "y", { num: true, id: "r" }))),
			el("span", { style: "color:var(--tenue);font-size:12.5px", text: "Sei in piedi sopra quest'altezza, oltre questa x: trascina la bandierina." }), spunta(o, "flag", "Con la bandiera a scacchi"));
		if (verbo === "prendi") metti(p, campo("Arma nella cassa", sceltaIn(o, "prendi", ARMI)));
		if (verbo === "hit" || verbo === "down") metti(p, campo("Chi", sceltaIn(o, verbo, [...robot, ["nemico", "un nemico qualsiasi"]], { num: false })),
			campo("Con", sceltaIn(o, "con", ["primaria", "secondaria", ...ARMI], { vuoto: "qualsiasi arma" })),
			verbo === "down" ? el("div", { class: "due" }, campo("Come", sceltaIn(o, "come", [["vuoto", "nel vuoto"]], { vuoto: "comunque" })), campo("Volte", testoIn(o, "times", { num: true }))) : null);
		if (verbo === "usa") metti(p, campo("Mossa", sceltaIn(o, "usa", USA)));
		if (c.aspetta) metti(p, el("div", { class: "gruppo" }, el("b", { text: "Finché non è fatto si può usare solo" }), multi(o, "only", ["primaria", "secondaria", "baratto", "teleport", ...ARMI.filter(w => w !== "teleport")]),
			campo("Zoom della camera", sceltaIn(o, "zoom", [[1, "vicino"], [2, "medio"], [3, "tutta la mappa"]], { vuoto: "come prima", num: true }))));
		metti(p, el("div", { class: "bottoni" },
			el("button", { class: "piccolo", disabled: s.i === 0 || null, onclick: () => { segna(); scambiaPassi(l, s.i, s.i - 1); stato.sel = { k: "passo", i: s.i - 1 }; rid(); } }, "Prima"),
			el("button", { class: "piccolo", disabled: s.i === l.obiettivo.length - 1 || null, onclick: () => { segna(); scambiaPassi(l, s.i, s.i + 1); stato.sel = { k: "passo", i: s.i + 1 }; rid(); } }, "Dopo"),
			togli("Elimina il passo", () => l.obiettivo.splice(s.i, 1))));
		// hit/down: il robot è un numero
		for (const id of ["f-hit", "f-down"]) { const x = p.querySelector("#" + id); if (x) x.addEventListener("change", () => { const v = x.value; o[id.slice(2)] = v === "nemico" ? v : +v; salvaBozza(); }); }
	} else if (s.k === "spawn" && l.giocatori && l.giocatori[s.i]) {
		const g = l.giocatori[s.i], sp = (l.spawns || [])[s.i];
		const nasc = { v: (l.nascosti || []).includes(s.i + 1) };
		metti(p, el("h3", { text: (s.i + 1) + ". " + nomeGiocatore(l, s.i) }),
			sp ? el("div", { class: "due" }, campo("x", testoIn(sp, "x", { num: true, id: "s" })), campo("Cade da (y)", testoIn(sp, "from", { num: true, id: "s" }))) : el("span", { style: "color:var(--tenue)", text: "Mappa del gioco: parte da un punto sicuro a caso." }));
		if (s.i > 0) {
			const ruolo = el("select", { id: "f-ruolo" });
			for (const [v, t] of [["dummy", "Fantoccio"], ["bot", "Bot"]]) ruolo.append(el("option", { value: v }, t));
			ruolo.value = g.dummy ? "dummy" : "bot";
			ruolo.addEventListener("change", () => { segna(); if (ruolo.value === "dummy") { g.dummy = true; delete g.bot; } else { delete g.dummy; g.bot = 3; } rid(); });
			metti(p, el("div", { class: "due" }, campo("Chi è", ruolo), campo("Squadra", sceltaIn(g, "team", [[1, "con te"], [2, "contro"]], { num: true }))));
			if (!g.dummy) metti(p, el("div", { class: "due" }, campo("Grado (1-10)", testoIn(g, "bot", { num: true })), campo("Carattere", sceltaIn(g, "carattere", ["codardo", "testa_calda", "cecchino", "spingitore"], { vuoto: "normale" }))),
				el("div", { class: "due" }, campo("Primaria", sceltaIn(g, "pick", ARMI.filter(w => !CAT.armi[w].secondaria && !CAT.armi[w].attrezzo), { vuoto: "a scelta" })), campo("Secondaria", sceltaIn(g, "secondary", ARMI.filter(w => CAT.armi[w].secondaria), { vuoto: "a scelta" }))));
			metti(p, el("div", { class: "due" }, campo("Nome", testoIn(g, "nome")), campo("Pelle", sceltaIn(g, "pelle", ["favilla"], { vuoto: "normale" }))));
			const v = (l.vita || {})[String(s.i + 1)];
			const vi = el("input", { type: "number", id: "f-vita", value: v == null ? "" : v });
			vi.addEventListener("change", () => { segna(); l.vita = l.vita || {}; if (vi.value === "") delete l.vita[String(s.i + 1)]; else l.vita[String(s.i + 1)] = +vi.value; if (!Object.keys(l.vita).length) delete l.vita; rid(); });
			metti(p, campo("Vita all'inizio (vuoto: 100)", vi), spunta(nasc, "v", "Nascosto (non c'è: il gioco vuole almeno due robot)"));
			p.querySelector("#f-v").addEventListener("change", e => {
				segna(); const set = new Set(l.nascosti || []); if (e.target.checked) set.add(s.i + 1); else set.delete(s.i + 1);
				if (set.size) l.nascosti = [...set].sort(); else delete l.nascosti; rid();
			});
			metti(p, togli("Togli il giocatore", () => {
				l.giocatori.splice(s.i, 1); if (l.spawns) l.spawns.splice(s.i, 1);
				if (l.nascosti) l.nascosti = l.nascosti.filter(n => n !== s.i + 1).map(n => n > s.i + 1 ? n - 1 : n);
			}));
		} else {
			metti(p, el("span", { style: "color:var(--tenue);font-size:12.5px", text: "Il giocatore 1 sei tu." }));
		}
	} else if (s.k === "rect" && l.arena && l.arena[s.i]) {
		const r = l.arena[s.i];
		const box = el("div", { class: "quattro" });
		["x", "y", "larghezza", "altezza"].forEach((n, j) => {
			const i = el("input", { type: "number", id: "f-r" + j, value: r[j] });
			i.addEventListener("change", () => { segna(); r[j] = +i.value; rid(); });
			box.append(campo(n, i));
		});
		metti(p, el("h3", { text: "Piattaforma " + (s.i + 1) }), box,
			el("span", { style: "color:var(--tenue);font-size:12.5px", text: "D'acciaio: i crateri non la rompono. Trascina il centro per spostarla, i quadratini per allungarla." }),
			togli("Elimina la piattaforma", () => l.arena.splice(s.i, 1)));
	} else if ((s.k === "cassa" && l.casse && l.casse[s.i]) || (s.k === "carta" && l.cards && l.cards[s.i])) {
		const x = s.k === "cassa" ? l.casse[s.i] : l.cards[s.i];
		const passi = [[0, "subito"], ...(l.obiettivo || []).map((o, i) => [i + 1, "dopo il passo " + (i + 1)])];
		metti(p, el("h3", { text: s.k === "cassa" ? "Cassa" : "Carta dell'arma" }),
			campo("Arma", sceltaIn(x, "arma", ARMI.map(w => [w, nomeArma(w)]))),
			campo("Quando", sceltaIn(x, "dopo", passi, { num: true })),
			s.k === "cassa" ? campo("x (dove cade)", testoIn(x, "x", { num: true })) : spunta(x, "give", "E te la dà, senza cassa"),
			togli("Elimina", () => (s.k === "cassa" ? l.casse : l.cards).splice(s.i, 1)));
	} else if (s.k === "guida" && l.guida && l.guida.percorso[s.i]) {
		const q = l.guida.percorso[s.i];
		metti(p, el("h3", { text: "Favilla, punto " + (s.i + 1) }),
			el("div", { class: "due" }, campo("x", testoIn(q, "x", { num: true, id: "g" })), campo("y", testoIn(q, "y", { num: true, id: "g" }))),
			el("div", { class: "due" }, campo("Ci arriva al secondo", testoIn(q, "t", { num: true, id: "g" })), campo("Salto (altezza)", testoIn(q, "salto", { num: true, id: "g" }))),
			el("div", { class: "gruppo" }, el("b", { text: "Tutto il percorso" }),
				campo("Parte dopo il passo", sceltaIn(l.guida, "parte", [[0, "subito"], ...(l.obiettivo || []).map((o, i) => [i + 1, String(i + 1)])], { num: true })),
				spunta(l.guida, "gara", "È una gara: la medaglia se arrivi prima di lei")),
			togli("Togli il punto", () => { l.guida.percorso.splice(s.i, 1); if (!l.guida.percorso.length) delete l.guida; }));
	} else if (s.k === "scintilla" && l.scintilla) {
		metti(p, el("h3", { text: "Scintilla" }),
			el("div", { class: "due" }, campo("x", testoIn(l.scintilla, "x", { num: true, id: "sc" })), campo("y", testoIn(l.scintilla, "y", { num: true, id: "sc" }))),
			el("span", { style: "color:var(--tenue);font-size:12.5px", text: "Si prende passandoci sopra coi piedi: conta per la medaglia «scintille»." }),
			togli("Togli la scintilla", () => { delete l.scintilla; }));
	} else {
		// il livello
		const pr = problemi(l, c);
		if (idDoppi().has(l.id)) pr.unshift("l'id " + l.id + " c'è due volte");
		metti(p, el("h3", { text: "Il livello" }),
			pr.length ? el("div", { class: "problemi" }, ...pr.map(t => el("span", { text: "• " + t }))) : null,
			el("div", { class: "due" }, campo("Titolo", testoIn(l, "titolo")), campo("Tipo", sceltaIn(l, "tipo", TIPI))),
			campo("Id (non cambiarlo per i livelli già giocati)", testoIn(l, "id")),
			campo("Prima riga (vignetta grande all'inizio)", testoIn(l, "goal_text", { area: true })),
			campo("Comando che lampeggia", sceltaIn(l, "highlight", COMANDI, { vuoto: "nessuno" })),
			l.goal_text ? anteprima(l.goal_text, chiParla(c), "spiega", true, l.highlight) : null,
			el("div", { class: "gruppo" }, el("b", { text: "La mappa" }), mappaIn(l)),
			c.aspetta ? el("div", { class: "gruppo" }, el("b", { text: "Cosa si vede nell'HUD" }), multi(l, "vedi", VEDI, true)) : null,
			el("div", { class: "gruppo" }, el("b", { text: "Regole" }),
				el("div", { class: "bottoni" }, spunta(l, "no_weapons", "Parti senza armi"), spunta(l, "without_time", "Senza tempo né turni"), spunta(l, "al_posto", "Si rinasce al proprio posto")),
				el("div", { class: "due" }, campo("Globi all'inizio", testoIn(l, "globi", { num: true })), campo("Turni massimi", testoIn(l, "turni", { num: true })))),
			el("div", { class: "gruppo" }, avanzato(l, "Tutti i campi (JSON, per stelle, medaglia, collaudo, piani dei bot...)", v => { cap().livelli[stato.l] = v; })));
	}
	if (s.k) p.prepend(el("button", { class: "piccolo", style: "align-self:flex-start", onclick: () => scegli(null) }, "← Il livello"));
}
function scambiaPassi(l, a, b) {
	[l.obiettivo[a], l.obiettivo[b]] = [l.obiettivo[b], l.obiettivo[a]];
	const m = n => n === a + 1 ? b + 1 : n === b + 1 ? a + 1 : n;
	const fix = q => { if (!q) return; if (q.passo != null) q.passo = m(q.passo); (q.uno || []).forEach(fix); };
	(l.righe || []).forEach(r => { fix(r.quando); fix(r.fino); });
	for (const k of ["casse", "cards"]) (l[k] || []).forEach(x => { x.dopo = m(x.dopo); });
}
function mappaIn(l) {
	const s = el("select", { id: "f-mappa" });
	s.append(el("option", { value: "" }, "Arena (piattaforme d'acciaio)"));
	for (const [id, m] of Object.entries(CAT.mappe)) s.append(el("option", { value: id }, m.nome || id));
	s.value = l.mappa || "";
	s.addEventListener("change", () => {
		segna();
		if (s.value) { delete l.arena; delete l.spawns; l.mappa = s.value; }
		else { delete l.mappa; l.arena = [[240, 0, 1440, 150]]; l.spawns = (l.giocatori || []).map((_, i) => ({ x: 400 + i * 300, from: 600 })); }
		stato.cam = null; cambiato();
	});
	return s;
}

// ---------------------------------------------------------------- GIOCA, Manda a Claude
function luaGioca() {
	const l = liv();
	const pulito = JSON.parse(JSON.stringify(l));
	return "return " + lua({ capitolo: cap().id, dipinto: !arenaCambiata(l), livello: pulito }, "");
}
async function gioca() {
	if (stato.vista !== "livello") return;
	let c = 0;
	try { const r = await fetch("game/megablast.html", { method: "HEAD" }); c = r.ok ? 1 : 0; } catch (e) { c = 0; }
	if (!c) { avviso("La build del gioco non è pubblicata con questa pagina: chiedi a Claude di rifarla con --gioco."); return; }
	document.getElementById("gioca-nome").textContent = "In prova: " + (liv().titolo || liv().id) + " (le modifiche non sono ancora nel gioco vero)";
	document.getElementById("gioca").hidden = false;
	carica();
}
function carica() {
	const f = document.getElementById("gioca-frame");
	f.src = "about:blank";
	setTimeout(() => { f.src = "game/megablast.html?copione=" + Date.now() + "#" + encodeURIComponent(luaGioca()); f.focus(); }, 50);
}
function chiudiGioca() { document.getElementById("gioca-frame").src = "about:blank"; document.getElementById("gioca").hidden = true; }

async function copia() {
	const t = levelsLua();
	try { await navigator.clipboard.writeText(t); avviso("Copiato: incollalo a Claude."); }
	catch (e) {
		const ta = el("textarea", { rows: 12, class: "num" }); ta.value = t;
		document.getElementById("main").prepend(ta); ta.select(); avviso("Seleziona e copia il testo qui sopra.");
	}
}
async function manda() {
	const b = document.getElementById("b-manda");
	b.disabled = true;
	try {
		const db = window.claude && await window.claude.use("db");
		if (!db) { avviso("Da qui non si manda: usa Copia il Lua e incollalo a Claude."); return; }
		await db.doc("copione/ultima").set({ lua: levelsLua(), capitoli: campaignCapitoli(), json: JSON.stringify(capitoli), livello: stato.vista === "livello" ? liv().id : "", quando: new Date().toISOString() });
		avviso("Mandato a Claude: digli di prendere il copione.");
	} catch (e) {
		avviso("Non è partito (" + ((e && (e.code || e.message)) || "errore") + "): usa Copia il Lua.");
	} finally { b.disabled = false; }
}

// ---------------------------------------------------------------- avvio
document.getElementById("marchio").addEventListener("click", () => { stato.vista = "cruscotto"; stato.sel = null; disegna(); });
document.getElementById("annulla").addEventListener("click", annulla);
document.getElementById("rifai").addEventListener("click", rifai);
document.getElementById("b-gioca").addEventListener("click", gioca);
document.getElementById("b-manda").addEventListener("click", manda);
document.getElementById("b-copia").addEventListener("click", copia);
document.getElementById("gioca-chiudi").addEventListener("click", chiudiGioca);
document.getElementById("gioca-ancora").addEventListener("click", carica);
(() => {
	const b = document.getElementById("b-ripristina");
	b.addEventListener("click", () => {
		const box = el("span", { class: "conferma" }, "Buttare le modifiche? ",
			el("button", { class: "piccolo", onclick: () => { segna(); capitoli = clone(DATI.capitoli); stato.sel = null; aggiusta(); cambiato(); box.replaceWith(b); avviso("Tornato al gioco di oggi."); } }, "Sì"),
			el("button", { class: "piccolo", onclick: () => box.replaceWith(b) }, "No"));
		b.replaceWith(box);
	});
})();
document.addEventListener("keydown", e => {
	if (e.target.closest("input, textarea, select")) return;
	if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? rifai() : annulla(); }
	if (e.key === "Escape" && !document.getElementById("gioca").hidden) chiudiGioca();
});
window.addEventListener("resize", () => { if (stato.vista === "livello") disegnaMappa(); });
disegna();
